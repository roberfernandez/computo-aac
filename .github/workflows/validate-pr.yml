name: Validate pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint app/computo-sync.ts app/tmb-session.ts app/page.tsx app/sap-review-panel.tsx
      - run: node --test tests/payroll-sync.test.mjs
      - run: node --test tests/computo-compensaciones.test.mjs
      - run: node --test tests/sap-comparison.test.mjs
      - run: node --check experiments/sap-windows-extension/background.mjs && node --check experiments/sap-windows-extension/computo-bridge.js && node --check experiments/sap-windows-extension/portal-monitor.js
      - run: node --test tests/sap-windows-bridge.test.mjs
      - run: node --test tests/sap-difference-reviews.test.mjs tests/worked-holiday-month-boundary.test.mjs
      - run: node --test tests/private-corrections.test.mjs tests/confirmed-corrections.test.mjs tests/sap-admin-ticket.test.mjs tests/sap-bridge-return.test.mjs experiments/sap-admin/android/tests/probe.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_GIT_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Package Windows SAP extension pilot
        run: |
          cd experiments
          zip -q -r sap-windows-extension-0.1.0.zip sap-windows-extension
      - uses: actions/upload-artifact@v4
        with:
          name: sap-windows-extension-0.1.0
          path: experiments/sap-windows-extension-0.1.0.zip
          retention-days: 14
