name: Prepare SAP Chrome Web Store package
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-sap-windows-pilot.yml
      - experiments/sap-windows-extension/**
      - tests/sap-windows-bridge.test.mjs
      - tests/sap-bridge-onboarding.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'roberfernandez/computo-aac'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Chrome bridge
        run: node --test tests/sap-windows-bridge.test.mjs tests/sap-bridge-onboarding.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chrome Store icons
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/prepare-sap-chrome-store.py
      - name: Package extension for Chrome Web Store review
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('experiments/sap-windows-extension/manifest.json','utf8')).version")"
          FILE="computo-pont-sap-chrome-webstore-v$VERSION.zip"
          cd experiments/sap-windows-extension
          zip -q "$GITHUB_WORKSPACE/$FILE" manifest.json background.mjs computo-bridge.js portal-monitor.js probe.js protocol.mjs icon-16.png icon-48.png icon-128.png
          cd "$GITHUB_WORKSPACE"
          test "$(unzip -Z1 "$FILE" | head -1)" = "manifest.json"
          ! unzip -Z1 "$FILE" | grep -q '^sap-windows-extension/'
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE"
      - name: Save developer-only Web Store upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sap-chrome-webstore-upload
          path: ${{ steps.bundle.outputs.file }}
          retention-days: 30
